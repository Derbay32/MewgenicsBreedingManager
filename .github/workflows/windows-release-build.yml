name: Build Windows Standalone

on:
  push:
    tags:
      - "*"
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and Upload Windows Zip
    runs-on: windows-latest
    if: >-
      (github.event_name == 'push' &&
      (contains(github.ref_name, 'beta') ||
      contains(github.ref_name, 'rc') ||
      contains(github.ref_name, 'alpha') ||
      contains(github.ref_name, 'preview') ||
      contains(github.ref_name, 'Beta') ||
      contains(github.ref_name, 'RC') ||
      contains(github.ref_name, 'Alpha') ||
      contains(github.ref_name, 'Preview'))) ||
      (github.event_name == 'release' && !github.event.release.prerelease)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "manual-${{ github.run_number }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build standalone exe
        working-directory: mewgenicsbreedingmanager
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean mewgenics_manager.spec

      - name: Pack zip
        id: pack
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $asset = "MewgenicsManager-$tag-windows-x64.zip"
          $staging = "release-package"

          if (Test-Path $staging) {
            Remove-Item -Recurse -Force $staging
          }
          New-Item -ItemType Directory -Path $staging | Out-Null

          Copy-Item "mewgenicsbreedingmanager\\dist\\MewgenicsManager.exe" "$staging\\MewgenicsManager.exe"
          if (Test-Path "README.md") {
            Copy-Item "README.md" "$staging\\README.md"
          }

          Compress-Archive -Path "$staging\\*" -DestinationPath $asset -Force

          "asset_name=$asset" >> $env:GITHUB_OUTPUT
          "asset_path=$asset" >> $env:GITHUB_OUTPUT

      - name: Upload to prerelease (beta/rc tags)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: true
          make_latest: false
          files: ${{ steps.pack.outputs.asset_path }}

      - name: Upload to existing release (stable)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.pack.outputs.asset_path }}
